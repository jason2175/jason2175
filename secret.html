<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nothing To See Here</title>
  <style>
    :root {
      --bg: #0d0f12;
      --text: #00ff88;
      --warn: #ff3366;
      --dim: #1f2937;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* CRT Scanline & Vignette Effect */
    body::before {
      content: " ";
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.8) 100%);
      background-size: 100% 4px, 100% 100%;
      pointer-events: none;
      z-index: 100;
    }

    .container {
      background: #13171f;
      border: 2px solid var(--text);
      border-radius: 8px;
      padding: 2.5rem;
      width: 90%;
      max-width: 650px;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.2);
      text-align: center;
      position: relative;
      transition: transform 0.1s;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
      display: inline-block;
      cursor: pointer;
    }

    .narrator-box {
      min-height: 60px;
      background: #080a0c;
      border: 1px dashed var(--dim);
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 2rem;
      color: #e5e7eb;
      font-size: 1.05rem;
    }

    .btn-zone {
      position: relative;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      background: var(--warn);
      color: #ffffff;
      border: none;
      padding: 0.9rem 1.8rem;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 51, 102, 0.4);
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    button:active {
      transform: scale(0.92);
    }

    .secret-input-wrapper {
      margin-top: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    .secret-input-wrapper.visible {
      opacity: 1;
      pointer-events: all;
    }

    input[type="text"] {
      background: #080a0c;
      border: 1px solid var(--text);
      color: var(--text);
      padding: 0.6rem 1rem;
      font-family: inherit;
      font-size: 1rem;
      width: 60%;
      border-radius: 4px;
      outline: none;
      text-align: center;
    }

    .broken-piece {
      position: absolute;
      cursor: grab;
      animation: fall 0.6s forwards cubic-bezier(0.5, 0, 0.75, 0);
    }

    @keyframes fall {
      to {
        transform: translateY(220px) rotate(45deg);
      }
    }

    .status-bar {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <!--
    ========================================================
    [SOURCE CODE INSPECTION DETECTED]
    EASTER EGG #1: You checked the source code!
    SECRET CODE: "404_REALITY"
    Try typing it into the terminal console or input box!
    ========================================================
  -->

  <div class="container" id="windowBox">
    <h1 id="titleText">SYSTEM OFFLINE</h1>
    
    <div class="narrator-box" id="narrator">
      Loading nothing... please close this tab.
    </div>

    <div class="btn-zone">
      <button id="mainBtn">DO NOT CLICK</button>
    </div>

    <div class="secret-input-wrapper" id="secretWrapper">
      <input type="text" id="commandInput" placeholder="Enter override code..." autocomplete="off" />
    </div>

    <div class="status-bar" id="statusBar">STATUS: NORMAL | PRESS [F12] FOR DEV CONSOLE</div>
  </div>

  <script>
    // --- Web Audio Synth Sound FX ---
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.1) {
      if (ctx.state === 'suspended') ctx.resume();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    }

    // --- DevTools Console Easter Egg ---
    console.log("%c[SYSTEM CONSOLE DETECTED]", "color: #00ff88; font-size: 16px; font-weight: bold;");
    console.log("%cNarrator: 'Hey! Stop digging through my scripts!'", "color: #ff3366; font-style: italic;");
    console.log("%cHint: Try typing %chelp()%c or %cunlock()%c in this console.", "color: #ccc;", "color: #00ff88;", "color: #ccc;", "color: #00ff88;", "color: #ccc;");

    window.help = () => {
      playBeep(600, 'triangle', 0.2);
      return "COMMANDS AVAILABLE: help(), unlock(), breakTitle()";
    };

    window.unlock = () => {
      triggerSuccess("CONSOLE OVERRIDE GRANTED.");
      return "SYSTEM REBOOTING...";
    };

    window.breakTitle = () => {
      breakOffLetter();
      return "Title damaged.";
    };

    // --- Game Logic & Interactions ---
    const narrator = document.getElementById("narrator");
    const btn = document.getElementById("mainBtn");
    const title = document.getElementById("titleText");
    const inputWrapper = document.getElementById("secretWrapper");
    const cmdInput = document.getElementById("commandInput");
    const statusBar = document.getElementById("statusBar");

    let clickCount = 0;
    let titleBroken = false;

    const dialogs = [
      "I explicitly said DO NOT CLICK. What is wrong with you?",
      "Stop it. There is literally no game here.",
      "Are you trying to break the UI? Because it's indestructible.",
      "Fine. Go ahead, click it again.",
      "Warning: Structural integrity falling...",
      "Look what you did. Now try clicking the broken Title above!"
    ];

    btn.addEventListener("click", () => {
      clickCount++;
      playBeep(200 + clickCount * 60, 'square', 0.08);

      if (clickCount <= dialogs.length) {
        narrator.innerText = dialogs[clickCount - 1];
      }

      // Move the button around slightly to be annoying
      const randX = (Math.random() - 0.5) * 80;
      const randY = (Math.random() - 0.5) * 40;
      btn.style.transform = `translate(${randX}px, ${randY}px)`;

      if (clickCount === 6) {
        title.style.color = "var(--warn)";
        title.title = "Click me to tear me down!";
      }
    });

    // --- Breaking UI Component ---
    title.addEventListener("click", () => {
      if (clickCount >= 6 && !titleBroken) {
        breakOffLetter();
      } else if (!titleBroken) {
        narrator.innerText = "Narrator: Why are you poking the title? Leave it alone!";
        playBeep(350, 'sawtooth', 0.05);
      }
    });

    function breakOffLetter() {
      titleBroken = true;
      playBeep(120, 'sawtooth', 0.4);
      title.innerText = "SYST  M OFFLINE";
      narrator.innerText = "Narrator: THE 'E' FELL OFF! Look what was behind it!";
      inputWrapper.classList.add("visible");
      cmdInput.focus();
    }

    // --- Hidden Code Processing ---
    cmdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const val = cmdInput.value.trim().toLowerCase();
        if (val === "404_reality" || val === "unlock" || val === "/?") {
          triggerSuccess("SECRET CODE ACCEPTED! LEVEL CLEARED.");
        } else {
          playBeep(100, 'sawtooth', 0.3);
          narrator.innerText = "Access Denied: '" + cmdInput.value + "' is not valid. (Did you check source code?)";
          cmdInput.value = "";
        }
      }
    });

    function triggerSuccess(msg) {
      playBeep(523.25, 'sine', 0.1);
      setTimeout(() => playBeep(659.25, 'sine', 0.1), 100);
      setTimeout(() => playBeep(783.99, 'sine', 0.3), 200);

      document.body.style.backgroundColor = "#002b1b";
      btn.style.display = "none";
      cmdInput.disabled = true;

      // Countdown logic before redirecting
      let timeLeft = 3;
      narrator.innerText = `${msg}\nRedirecting to secret page in ${timeLeft}...`;
      statusBar.innerText = `STATUS: ANOMALY SOLVED | REDIRECTING IN ${timeLeft}s`;

      const countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          narrator.innerText = `${msg}\nRedirecting to secret page in ${timeLeft}...`;
          statusBar.innerText = `STATUS: ANOMALY SOLVED | REDIRECTING IN ${timeLeft}s`;
        } else {
          clearInterval(countdownInterval);
          // Destination URL
          window.location.href = "another-page.html";
        }
      }, 1000);
    }

    // Secret Key Trigger: Typing '/?' on keyboard directly
    let keyBuffer = "";
    window.addEventListener("keydown", (e) => {
      keyBuffer += e.key;
      if (keyBuffer.endsWith("/?")) {
        playBeep(880, 'sine', 0.2);
        narrator.innerText = "Help shortcut recognized! Try reading the page source (Ctrl+U).";
      }
    });
  </script>
</body>
</html>
